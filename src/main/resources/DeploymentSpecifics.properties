instance.name=HaalCentraal-Connector
configurations.directory.autoLoad=true
classloader.type=ScanningDirectoryClassLoader
configurations.brp-personen-bevragen-rest.classLoaderType=DirectoryClassLoader
configurations.brp-personen-bevragen-soap.classLoaderType=DirectoryClassLoader
configurations.brp-personen-bevragen-outway.classLoaderType=DirectoryClassLoader
configurations.subscription-management-and-processing.classLoaderType=DirectoryClassLoader
configurations.oauth.classLoaderType=DirectoryClassLoader
configurations.shadow.classLoaderType=DirectoryClassLoader

# Legacy: environment options: production, staging, test. Only used to derive the default of hcc.outway.brp.url
environment=test

# Diginet endpoints, based on environment
endpoint.brp.diginet=${endpoint.brp.diginet.${environment}}
oauth.token.url=${oauth.token.url.${environment}}
oauth.token.url.production=https://auth.idm.diginetwerk.net/nidp/oauth/nam/token
oauth.token.url.staging=https://auth.npr.idm.diginetwerk.net/nidp/oauth/nam/token
endpoint.brp.diginet.staging=https://apigw.npr.idm.diginetwerk.net/lap/api/brp/personen
endpoint.brp.diginet.production=https://apigw.idm.diginetwerk.net/api/brp/personen

# Disable output streaming (seems not to be disabled by default in 7.9-SNAPSHOT (in 7.8 it is))
streaming.auto=false
manageDatabase.webServiceListener.active=true
wsdl.caching=false

warnings.suppress.sqlInjections.ManageDatabase=true
manageDatabase.active = false
jdbc.migrator.active=true

NotificationProcessorApi.active=false

ibistesttool.custom=Custom
# Useful to prevent large messages from being truncated in Ladybug but can give Java heap space errors
# ibistesttool.maxMemoryUsage=1000000000
# ibistesttool.maxFileSize=10MB
# ibistesttool.maxMessageLength=10000000

# defaultValue for gemeenteVanInschrijving
gemeenteVanInschrijving=0518

applicationConfigPath=${configurations.directory}/subscription-management-and-processing/json/ApplicationConfig.json
haalcentraal.BRP.personen.bevragen.endpoint.proefomgeving=https://proefomgeving.haalcentraal.nl/haalcentraal/api/brp
lokaal.haalcentraal.BRP.personen.bevragen.endpoint=http://localhost:5001/haalcentraal/api/brp
kadaster.BRK.Bevragen.API=https://api.brk.kadaster.nl/esd-eto-apikey/bevragen/v2
MAX_RETRIES=3

haalcentraal_connector.notification.rest.endpoint=webhooks_brp
haalcentraal_connector.soap.endpoint=haalcentraal_soap
haalcentraal_connector.shadow.endpoint=shadow
haalcentraal_connector.shadow.analitics.endpoint=shadow_analitics

haalcentraal_cert_pass=
haalcentraal_cert_pass_authAlias=diginet.clientCert
haalcentraal_cert_alias=haalcentraal

haalcentraal_connector.endpoint.softfail=false

#Sharedresources
# For backwards compatibility
oauth.token.url=
oauth.scope=
haalcentraal_cert_path=
haalcentraal_cert_pass=
haalcentraal_cert_pass_authAlias=diginet.clientCert
haalcentraal_cert_alias=haalcentraal

# Legacy: authType options: none, mtls, oauth2 (where oauth2 means oauth2 + mTLS).
# Only used to derive the defaults of hcc.outway.brp.authType and hcc.outway.callback.authType
hcc.outway.authType=oauth2

hcc.outway.authAlias=
hcc.outway.clientAlias=oauth.credentials
hcc.outway.clientId=
hcc.outway.clientSecret=
hcc.outway.tokenEndpoint=${oauth.token.url}
hcc.outway.oauthAuthenticationMethod=CLIENT_CREDENTIALS_BASIC_AUTH
hcc.outway.scope=${oauth.scope}

hcc.outway.proxy.host=
hcc.outway.proxy.port=
hcc.outway.proxy.authAlias=

hcc.outway.keystore.uri=${haalcentraal_cert_path}
hcc.outway.keystore.type=PKCS12
hcc.outway.keystore.authAlias=
hcc.outway.keystore.alias=${haalcentraal_cert_alias}
hcc.outway.keystore.aliasAuthAlias=${haalcentraal_cert_pass_authAlias}
hcc.outway.keystore.password=${haalcentraal_cert_pass}

hcc.outway.resource.server=ResourceServer01

# Legacy: when true, brp-personen-bevragen-outway calls the public proefomgeving with an X-API-KEY header, regardless of hcc.outway.authType.
# Prefer setting hcc.outway.brp.authType and hcc.outway.brp.url instead.
brp.proefomgeving.active=true

# Outgoing connections. Each connection picks one authType; the configurations themselves are unaware of which one is used.
# authType options:
#   none       -> no authentication, e.g. a local mock service
#   header     -> X-API-KEY header from authAlias hcc.outway.header.authAlias, e.g. the Haalcentraal public 'proefomgeving' (BRP only)
#   mtls       -> gateway, mTLS for trust and identity/auth
#   oauth2     -> gateway, oauth2
#   oauth2mtls -> gateway (or legacy direct Diginetwerk), mTLS for trust + oauth2 for identity/auth
# The credentials for mtls/oauth2/oauth2mtls are the hcc.outway.* properties above.
# Defaults are derived from the legacy properties brp.proefomgeving.active, hcc.outway.authType and environment

# BRP API calls (brp-personen-bevragen-outway)
hcc.outway.brp.authType=${hcc.outway.brp.authType.legacy.${brp.proefomgeving.active}}
hcc.outway.brp.url=${hcc.outway.brp.url.legacy.${brp.proefomgeving.active}}
hcc.outway.header.authAlias=X-API-KEY

# Callbacks to applications (subscription-management-and-processing), the url comes from the application config
hcc.outway.callback.authType=${hcc.outway.callback.authType.legacy.${brp.proefomgeving.active}}

# Internal, do not override: legacy defaults
hcc.outway.brp.authType.legacy.true=header
hcc.outway.brp.authType.legacy.false=${hcc.outway.authType.legacy.${hcc.outway.authType}}
hcc.outway.brp.url.legacy.true=${endpoint.brp.public.test}
hcc.outway.brp.url.legacy.false=${endpoint.brp.diginet}
hcc.outway.callback.authType.legacy.true=none
hcc.outway.callback.authType.legacy.false=${hcc.outway.authType.legacy.${hcc.outway.authType}}
hcc.outway.authType.legacy.none=none
hcc.outway.authType.legacy.mtls=mtls
hcc.outway.authType.legacy.oauth2=oauth2mtls

# Internal, do not override: only the HttpSession named in the authType is active.
# Properties can't compare values, so each session looks itself up by authType. E.g. with hcc.outway.brp.authType=oauth2:
#   hcc.outway.brp.oauth2.active -> hcc.outway.oauth2.activeWhen.oauth2 -> true
#   hcc.outway.brp.mtls.active   -> hcc.outway.mtls.activeWhen.oauth2   -> doesn't exist -> false
hcc.outway.none.activeWhen.none=true
hcc.outway.header.activeWhen.header=true
hcc.outway.mtls.activeWhen.mtls=true
hcc.outway.oauth2.activeWhen.oauth2=true
hcc.outway.oauth2mtls.activeWhen.oauth2mtls=true

hcc.outway.brp.none.active=${hcc.outway.none.activeWhen.${hcc.outway.brp.authType}:-false}
hcc.outway.brp.header.active=${hcc.outway.header.activeWhen.${hcc.outway.brp.authType}:-false}
hcc.outway.brp.mtls.active=${hcc.outway.mtls.activeWhen.${hcc.outway.brp.authType}:-false}
hcc.outway.brp.oauth2.active=${hcc.outway.oauth2.activeWhen.${hcc.outway.brp.authType}:-false}
hcc.outway.brp.oauth2mtls.active=${hcc.outway.oauth2mtls.activeWhen.${hcc.outway.brp.authType}:-false}

hcc.outway.callback.none.active=${hcc.outway.none.activeWhen.${hcc.outway.callback.authType}:-false}
hcc.outway.callback.mtls.active=${hcc.outway.mtls.activeWhen.${hcc.outway.callback.authType}:-false}
hcc.outway.callback.oauth2.active=${hcc.outway.oauth2.activeWhen.${hcc.outway.callback.authType}:-false}
hcc.outway.callback.oauth2mtls.active=${hcc.outway.oauth2mtls.activeWhen.${hcc.outway.callback.authType}:-false}

# Internal, do not override: only send the X-API-KEY header for authType header
hcc.outway.brp.header.authAlias.header=${hcc.outway.header.authAlias}
