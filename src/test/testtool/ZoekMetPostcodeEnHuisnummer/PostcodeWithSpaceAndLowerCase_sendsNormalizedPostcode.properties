scenario.description = Given postcode '2497 bv' (with space and lower case), sends the normalized postcode 2497BV to HaalCentraal

include = ../common.properties

adapter.BrpPersonenQuerySender.param1.name = headers
adapter.BrpPersonenQuerySender.param1.value = <headers><header name="SOAPAction">http://www.egem.nl/StUF/sector/bg/0310/npsLv01</header></headers>

step1.adapter.BrpPersonenQuerySender.write = PostcodeWithSpaceAndLowerCase_sendsNormalizedPostcode/request.xml
step2.stub.PostBRPPersonenBevragenDiginetwerkSender.read = PostcodeWithSpaceAndLowerCase_sendsNormalizedPostcode/BRP_in.json
step3.stub.PostBRPPersonenBevragenDiginetwerkSender.write = PostcodeWithSpaceAndLowerCase_sendsNormalizedPostcode/BRP_out.json
step4.stub.GetPersoonssleutel.read = PostcodeWithSpaceAndLowerCase_sendsNormalizedPostcode/GetPersoonssleutel_in.txt
step5.stub.GetPersoonssleutel.write = PostcodeWithSpaceAndLowerCase_sendsNormalizedPostcode/GetPersoonssleutel_out.txt
step6.adapter.BrpPersonenQuerySender.read = PostcodeWithSpaceAndLowerCase_sendsNormalizedPostcode/response.xml