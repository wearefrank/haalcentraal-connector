scenario.description = Given geslachtsnaam, voornamen, aoa.postcode and aoa.huisnummer, still sends ZoekMetPostcodeEnHuisnummer and not ZoekMetNaamEnGemeenteVanInschrijving

include = ../common.properties

adapter.BrpPersonenQuerySender.param1.name = headers
adapter.BrpPersonenQuerySender.param1.value = <headers><header name="SOAPAction">http://www.egem.nl/StUF/sector/bg/0310/npsLv01</header></headers>

step1.adapter.BrpPersonenQuerySender.write = NaamWithPostcodeAndHuisnummer_usesZoekMetPostcodeEnHuisnummer/request.xml
step2.stub.PostBRPPersonenBevragenDiginetwerkSender.read = NaamWithPostcodeAndHuisnummer_usesZoekMetPostcodeEnHuisnummer/BRP_in.json
step3.stub.PostBRPPersonenBevragenDiginetwerkSender.write = NaamWithPostcodeAndHuisnummer_usesZoekMetPostcodeEnHuisnummer/BRP_out.json
step4.stub.GetPersoonssleutel.read = NaamWithPostcodeAndHuisnummer_usesZoekMetPostcodeEnHuisnummer/GetPersoonssleutel_in.txt
step5.stub.GetPersoonssleutel.write = NaamWithPostcodeAndHuisnummer_usesZoekMetPostcodeEnHuisnummer/GetPersoonssleutel_out.txt
step6.adapter.BrpPersonenQuerySender.read = NaamWithPostcodeAndHuisnummer_usesZoekMetPostcodeEnHuisnummer/response.xml
