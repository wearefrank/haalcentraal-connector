scenario.description = Given a dissolved registered partnership (2010-11-02) and a partner who died on 2015-01-01, looks up only that partner (burgerservicenummer, overlijden.datum) and returns burgerlijkeStaat 6 and redenOntbinding S

include = ../common.properties

removeRegularExpressionKey1.key = (?s)<BG:stuurgegevens[^>]*>.*?</BG:stuurgegevens>
removeRegularExpressionKey2.key = (?s)<BG:parameters[^>]*>.*?</BG:parameters>

adapter.BrpPersonenQuerySender.param1.name = headers
adapter.BrpPersonenQuerySender.param1.value = <headers><header name="SOAPAction">http://www.egem.nl/StUF/sector/bg/0310/npsLv01</header></headers>

step1.adapter.BrpPersonenQuerySender.write = DissolvedPartnership_PartnerDiedAfterDissolution_returnsPartnerschapBeeindigd/request.xml
step2.stub.PostBRPPersonenBevragenDiginetwerkSender.read = DissolvedPartnership_PartnerDiedAfterDissolution_returnsPartnerschapBeeindigd/BRP_in.json
step3.stub.PostBRPPersonenBevragenDiginetwerkSender.write = DissolvedPartnership_PartnerDiedAfterDissolution_returnsPartnerschapBeeindigd/BRP_out.json
step4.stub.GetPersoonssleutel.read = DissolvedPartnership_PartnerDiedAfterDissolution_returnsPartnerschapBeeindigd/GetPersoonssleutel_in.txt
step5.stub.GetPersoonssleutel.write = DissolvedPartnership_PartnerDiedAfterDissolution_returnsPartnerschapBeeindigd/GetPersoonssleutel_out.txt
step6.stub.PostBRPPersonenBevragenDiginetwerkSender.read = DissolvedPartnership_PartnerDiedAfterDissolution_returnsPartnerschapBeeindigd/PartnerLookup_in.json
step7.stub.PostBRPPersonenBevragenDiginetwerkSender.write = DissolvedPartnership_PartnerDiedAfterDissolution_returnsPartnerschapBeeindigd/PartnerLookup_out.json
step8.adapter.BrpPersonenQuerySender.read = DissolvedPartnership_PartnerDiedAfterDissolution_returnsPartnerschapBeeindigd/response.xml
