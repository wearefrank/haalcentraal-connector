scenario.description = Given a marriage whose dissolution only has inOnderzoek and no date, returns burgerlijkeStaat 2 (gehuwd)

include = ../common.properties

removeRegularExpressionKey1.key = (?s)<BG:stuurgegevens[^>]*>.*?</BG:stuurgegevens>
removeRegularExpressionKey2.key = (?s)<BG:parameters[^>]*>.*?</BG:parameters>

adapter.BrpPersonenQuerySender.param1.name = headers
adapter.BrpPersonenQuerySender.param1.value = <headers><header name="SOAPAction">http://www.egem.nl/StUF/sector/bg/0310/npsLv01</header></headers>

step1.adapter.BrpPersonenQuerySender.write = MarriageDissolutionOnlyInOnderzoek_returnsGehuwd/request.xml
step2.stub.PostBRPPersonenBevragenDiginetwerkSender.read = MarriageDissolutionOnlyInOnderzoek_returnsGehuwd/BRP_in.json
step3.stub.PostBRPPersonenBevragenDiginetwerkSender.write = MarriageDissolutionOnlyInOnderzoek_returnsGehuwd/BRP_out.json
step4.stub.GetPersoonssleutel.read = MarriageDissolutionOnlyInOnderzoek_returnsGehuwd/GetPersoonssleutel_in.txt
step5.stub.GetPersoonssleutel.write = MarriageDissolutionOnlyInOnderzoek_returnsGehuwd/GetPersoonssleutel_out.txt
step6.adapter.BrpPersonenQuerySender.read = MarriageDissolutionOnlyInOnderzoek_returnsGehuwd/response.xml
