scenario.description = Given tijdvakRelatie with populated dates, returns formatted dates in the StUF namespace

include = ../common.properties

ignoreContentBetweenKeys.stuurgegevens.key1 = <BG:stuurgegevens>
ignoreContentBetweenKeys.stuurgegevens.key2 = </BG:stuurgegevens>
ignoreContentBetweenKeys.parameters.key1 = <BG:parameters>
ignoreContentBetweenKeys.parameters.key2 = </BG:parameters>

adapter.BrpPersonenQuerySender.param1.name = headers
adapter.BrpPersonenQuerySender.param1.value = <headers><header name="SOAPAction">http://www.egem.nl/StUF/sector/bg/0310/npsLv01</header></headers>

step1.adapter.BrpPersonenQuerySender.write = tijdvakRelatie_returnsStufDates/request.xml
step2.stub.PostBRPPersonenBevragenDiginetwerkSender.read = tijdvakRelatie_returnsStufDates/BRP_in.json
step3.stub.PostBRPPersonenBevragenDiginetwerkSender.write = tijdvakRelatie_returnsStufDates/BRP_out.json
step4.stub.GetPersoonssleutel.read = tijdvakRelatie_returnsStufDates/GetPersoonssleutel_in.txt
step5.stub.GetPersoonssleutel.write = tijdvakRelatie_returnsStufDates/GetPersoonssleutel_out.txt
step6.adapter.BrpPersonenQuerySender.read = tijdvakRelatie_returnsStufDates/response.xml