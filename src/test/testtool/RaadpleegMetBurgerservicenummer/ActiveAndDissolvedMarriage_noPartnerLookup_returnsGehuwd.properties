scenario.description = Given an active marriage next to a dissolved one, does no partner lookup and returns burgerlijkeStaat 2 (gehuwd)

include = ../common.properties

removeRegularExpressionKey1.key = (?s)<BG:stuurgegevens[^>]*>.*?</BG:stuurgegevens>
removeRegularExpressionKey2.key = (?s)<BG:parameters[^>]*>.*?</BG:parameters>

adapter.BrpPersonenQuerySender.param1.name = headers
adapter.BrpPersonenQuerySender.param1.value = <headers><header name="SOAPAction">http://www.egem.nl/StUF/sector/bg/0310/npsLv01</header></headers>

step1.adapter.BrpPersonenQuerySender.write = ActiveAndDissolvedMarriage_noPartnerLookup_returnsGehuwd/request.xml
step2.stub.PostBRPPersonenBevragenDiginetwerkSender.read = ActiveAndDissolvedMarriage_noPartnerLookup_returnsGehuwd/BRP_in.json
step3.stub.PostBRPPersonenBevragenDiginetwerkSender.write = ActiveAndDissolvedMarriage_noPartnerLookup_returnsGehuwd/BRP_out.json
step4.stub.GetPersoonssleutel.read = ActiveAndDissolvedMarriage_noPartnerLookup_returnsGehuwd/GetPersoonssleutel_in.txt
step5.stub.GetPersoonssleutel.write = ActiveAndDissolvedMarriage_noPartnerLookup_returnsGehuwd/GetPersoonssleutel_out.txt
step6.adapter.BrpPersonenQuerySender.read = ActiveAndDissolvedMarriage_noPartnerLookup_returnsGehuwd/response.xml
