scenario.description = Given a marriage dissolved on an incomplete date (JaarMaandDatum), returns burgerlijkeStaat 3 (gescheiden)

include = ../common.properties

removeRegularExpressionKey1.key = (?s)<BG:stuurgegevens[^>]*>.*?</BG:stuurgegevens>
removeRegularExpressionKey2.key = (?s)<BG:parameters[^>]*>.*?</BG:parameters>

adapter.BrpPersonenQuerySender.param1.name = headers
adapter.BrpPersonenQuerySender.param1.value = <headers><header name="SOAPAction">http://www.egem.nl/StUF/sector/bg/0310/npsLv01</header></headers>

step1.adapter.BrpPersonenQuerySender.write = DissolvedMarriageWithPartialDate_returnsGescheiden/request.xml
step2.stub.PostBRPPersonenBevragenDiginetwerkSender.read = DissolvedMarriageWithPartialDate_returnsGescheiden/BRP_in.json
step3.stub.PostBRPPersonenBevragenDiginetwerkSender.write = DissolvedMarriageWithPartialDate_returnsGescheiden/BRP_out.json
step4.stub.GetPersoonssleutel.read = DissolvedMarriageWithPartialDate_returnsGescheiden/GetPersoonssleutel_in.txt
step5.stub.GetPersoonssleutel.write = DissolvedMarriageWithPartialDate_returnsGescheiden/GetPersoonssleutel_out.txt
step6.adapter.BrpPersonenQuerySender.read = DissolvedMarriageWithPartialDate_returnsGescheiden/response.xml
