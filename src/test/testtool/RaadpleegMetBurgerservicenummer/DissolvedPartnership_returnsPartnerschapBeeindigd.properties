scenario.description = Given a registered partnership with a dissolution date, returns burgerlijkeStaat 6 (partnerschap beeindigd)

include = ../common.properties

removeRegularExpressionKey1.key = (?s)<BG:stuurgegevens[^>]*>.*?</BG:stuurgegevens>
removeRegularExpressionKey2.key = (?s)<BG:parameters[^>]*>.*?</BG:parameters>

adapter.BrpPersonenQuerySender.param1.name = headers
adapter.BrpPersonenQuerySender.param1.value = <headers><header name="SOAPAction">http://www.egem.nl/StUF/sector/bg/0310/npsLv01</header></headers>

step1.adapter.BrpPersonenQuerySender.write = DissolvedPartnership_returnsPartnerschapBeeindigd/request.xml
step2.stub.PostBRPPersonenBevragenDiginetwerkSender.read = DissolvedPartnership_returnsPartnerschapBeeindigd/BRP_in.json
step3.stub.PostBRPPersonenBevragenDiginetwerkSender.write = DissolvedPartnership_returnsPartnerschapBeeindigd/BRP_out.json
step4.stub.GetPersoonssleutel.read = DissolvedPartnership_returnsPartnerschapBeeindigd/GetPersoonssleutel_in.txt
step5.stub.GetPersoonssleutel.write = DissolvedPartnership_returnsPartnerschapBeeindigd/GetPersoonssleutel_out.txt
step6.adapter.BrpPersonenQuerySender.read = DissolvedPartnership_returnsPartnerschapBeeindigd/response.xml
