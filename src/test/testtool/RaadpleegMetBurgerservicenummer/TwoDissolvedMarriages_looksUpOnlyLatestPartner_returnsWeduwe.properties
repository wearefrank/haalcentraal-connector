scenario.description = Given two dissolved marriages, looks up only the partner of the most recently dissolved marriage (died on the dissolution date) and returns burgerlijkeStaat 4

include = ../common.properties

removeRegularExpressionKey1.key = (?s)<BG:stuurgegevens[^>]*>.*?</BG:stuurgegevens>
removeRegularExpressionKey2.key = (?s)<BG:parameters[^>]*>.*?</BG:parameters>

adapter.BrpPersonenQuerySender.param1.name = headers
adapter.BrpPersonenQuerySender.param1.value = <headers><header name="SOAPAction">http://www.egem.nl/StUF/sector/bg/0310/npsLv01</header></headers>

step1.adapter.BrpPersonenQuerySender.write = TwoDissolvedMarriages_looksUpOnlyLatestPartner_returnsWeduwe/request.xml
step2.stub.PostBRPPersonenBevragenDiginetwerkSender.read = TwoDissolvedMarriages_looksUpOnlyLatestPartner_returnsWeduwe/BRP_in.json
step3.stub.PostBRPPersonenBevragenDiginetwerkSender.write = TwoDissolvedMarriages_looksUpOnlyLatestPartner_returnsWeduwe/BRP_out.json
step4.stub.GetPersoonssleutel.read = TwoDissolvedMarriages_looksUpOnlyLatestPartner_returnsWeduwe/GetPersoonssleutel_in.txt
step5.stub.GetPersoonssleutel.write = TwoDissolvedMarriages_looksUpOnlyLatestPartner_returnsWeduwe/GetPersoonssleutel_out.txt
step6.stub.PostBRPPersonenBevragenDiginetwerkSender.read = TwoDissolvedMarriages_looksUpOnlyLatestPartner_returnsWeduwe/PartnerLookup_in.json
step7.stub.PostBRPPersonenBevragenDiginetwerkSender.write = TwoDissolvedMarriages_looksUpOnlyLatestPartner_returnsWeduwe/PartnerLookup_out.json
step8.adapter.BrpPersonenQuerySender.read = TwoDissolvedMarriages_looksUpOnlyLatestPartner_returnsWeduwe/response.xml
