scenario.description = Given tijdvakRelatie with missing dates, returns nil dates with noValue in the StUF namespace

include = ../common.properties

adapter.BrpPersonenQuerySender.param1.name = headers
adapter.BrpPersonenQuerySender.param1.value = <headers><header name="SOAPAction">http://www.egem.nl/StUF/sector/bg/0310/npsLv01</header></headers>

step1.adapter.BrpPersonenQuerySender.write = tijdvakRelatieMissingDates_returnsStufNoValue/request.xml
step2.stub.PostBRPPersonenBevragenDiginetwerkSender.read = tijdvakRelatieMissingDates_returnsStufNoValue/BRP_in.json
step3.stub.PostBRPPersonenBevragenDiginetwerkSender.write = tijdvakRelatieMissingDates_returnsStufNoValue/BRP_out.json
step4.stub.GetPersoonssleutel.read = tijdvakRelatieMissingDates_returnsStufNoValue/GetPersoonssleutel_in.txt
step5.stub.GetPersoonssleutel.write = tijdvakRelatieMissingDates_returnsStufNoValue/GetPersoonssleutel_out.txt
step6.adapter.BrpPersonenQuerySender.read = tijdvakRelatieMissingDates_returnsStufNoValue/response.xml