scenario.description = Given a marriage dissolved on 17 May 1990 and a partner who died in April 1990 (JaarMaandDatum), returns burgerlijkeStaat 4 and redenOntbinding O

include = ../common.properties

removeRegularExpressionKey1.key = (?s)<BG:stuurgegevens[^>]*>.*?</BG:stuurgegevens>
removeRegularExpressionKey2.key = (?s)<BG:parameters[^>]*>.*?</BG:parameters>

adapter.BrpPersonenQuerySender.param1.name = headers
adapter.BrpPersonenQuerySender.param1.value = <headers><header name="SOAPAction">http://www.egem.nl/StUF/sector/bg/0310/npsLv01</header></headers>

step1.adapter.BrpPersonenQuerySender.write = DissolvedMarriage_PartnerDiedInEarlierMonth_returnsWeduwe/request.xml
step2.stub.PostBRPPersonenBevragenDiginetwerkSender.read = DissolvedMarriage_PartnerDiedInEarlierMonth_returnsWeduwe/BRP_in.json
step3.stub.PostBRPPersonenBevragenDiginetwerkSender.write = DissolvedMarriage_PartnerDiedInEarlierMonth_returnsWeduwe/BRP_out.json
step4.stub.GetPersoonssleutel.read = DissolvedMarriage_PartnerDiedInEarlierMonth_returnsWeduwe/GetPersoonssleutel_in.txt
step5.stub.GetPersoonssleutel.write = DissolvedMarriage_PartnerDiedInEarlierMonth_returnsWeduwe/GetPersoonssleutel_out.txt
step6.stub.PostBRPPersonenBevragenDiginetwerkSender.read = DissolvedMarriage_PartnerDiedInEarlierMonth_returnsWeduwe/PartnerLookup_in.json
step7.stub.PostBRPPersonenBevragenDiginetwerkSender.write = DissolvedMarriage_PartnerDiedInEarlierMonth_returnsWeduwe/PartnerLookup_out.json
step8.adapter.BrpPersonenQuerySender.read = DissolvedMarriage_PartnerDiedInEarlierMonth_returnsWeduwe/response.xml
