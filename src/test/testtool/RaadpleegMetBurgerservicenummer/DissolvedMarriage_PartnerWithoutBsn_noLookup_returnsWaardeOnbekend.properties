scenario.description = Given a dissolved marriage with a partner without BSN, does not look up the partner and returns burgerlijkeStaat and redenOntbinding waardeOnbekend

include = ../common.properties

adapter.BrpPersonenQuerySender.param1.name = headers
adapter.BrpPersonenQuerySender.param1.value = <headers><header name="SOAPAction">http://www.egem.nl/StUF/sector/bg/0310/npsLv01</header></headers>

step1.adapter.BrpPersonenQuerySender.write = DissolvedMarriage_PartnerWithoutBsn_noLookup_returnsWaardeOnbekend/request.xml
step2.stub.PostBRPPersonenBevragenDiginetwerkSender.read = DissolvedMarriage_PartnerWithoutBsn_noLookup_returnsWaardeOnbekend/BRP_in.json
step3.stub.PostBRPPersonenBevragenDiginetwerkSender.write = DissolvedMarriage_PartnerWithoutBsn_noLookup_returnsWaardeOnbekend/BRP_out.json
step4.stub.GetPersoonssleutel.read = DissolvedMarriage_PartnerWithoutBsn_noLookup_returnsWaardeOnbekend/GetPersoonssleutel_in.txt
step5.stub.GetPersoonssleutel.write = DissolvedMarriage_PartnerWithoutBsn_noLookup_returnsWaardeOnbekend/GetPersoonssleutel_out.txt
step6.adapter.BrpPersonenQuerySender.read = DissolvedMarriage_PartnerWithoutBsn_noLookup_returnsWaardeOnbekend/response.xml