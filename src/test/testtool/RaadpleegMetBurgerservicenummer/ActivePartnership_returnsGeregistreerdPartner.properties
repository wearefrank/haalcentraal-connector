scenario.description = Given a registered partnership without dissolution, returns burgerlijkeStaat 5 (geregistreerd partner)

include = ../common.properties

removeRegularExpressionKey1.key = (?s)<BG:stuurgegevens[^>]*>.*?</BG:stuurgegevens>
removeRegularExpressionKey2.key = (?s)<BG:parameters[^>]*>.*?</BG:parameters>

adapter.BrpPersonenQuerySender.param1.name = headers
adapter.BrpPersonenQuerySender.param1.value = <headers><header name="SOAPAction">http://www.egem.nl/StUF/sector/bg/0310/npsLv01</header></headers>

step1.adapter.BrpPersonenQuerySender.write = ActivePartnership_returnsGeregistreerdPartner/request.xml
step2.stub.PostBRPPersonenBevragenDiginetwerkSender.read = ActivePartnership_returnsGeregistreerdPartner/BRP_in.json
step3.stub.PostBRPPersonenBevragenDiginetwerkSender.write = ActivePartnership_returnsGeregistreerdPartner/BRP_out.json
step4.stub.GetPersoonssleutel.read = ActivePartnership_returnsGeregistreerdPartner/GetPersoonssleutel_in.txt
step5.stub.GetPersoonssleutel.write = ActivePartnership_returnsGeregistreerdPartner/GetPersoonssleutel_out.txt
step6.adapter.BrpPersonenQuerySender.read = ActivePartnership_returnsGeregistreerdPartner/response.xml
