scenario.description = Given a dissolved marriage and a failing partner lookup, the main request still succeeds with burgerlijkeStaat waardeOnbekend

include = ../common.properties

removeRegularExpressionKey1.key = (?s)<BG:stuurgegevens[^>]*>.*?</BG:stuurgegevens>
removeRegularExpressionKey2.key = (?s)<BG:parameters[^>]*>.*?</BG:parameters>

adapter.BrpPersonenQuerySender.param1.name = headers
adapter.BrpPersonenQuerySender.param1.value = <headers><header name="SOAPAction">http://www.egem.nl/StUF/sector/bg/0310/npsLv01</header></headers>

step1.adapter.BrpPersonenQuerySender.write = DissolvedMarriage_PartnerLookupFails_returnsWaardeOnbekend/request.xml
step2.stub.PostBRPPersonenBevragenDiginetwerkSender.read = DissolvedMarriage_PartnerLookupFails_returnsWaardeOnbekend/BRP_in.json
step3.stub.PostBRPPersonenBevragenDiginetwerkSender.write = DissolvedMarriage_PartnerLookupFails_returnsWaardeOnbekend/BRP_out.json
step4.stub.GetPersoonssleutel.read = DissolvedMarriage_PartnerLookupFails_returnsWaardeOnbekend/GetPersoonssleutel_in.txt
step5.stub.GetPersoonssleutel.write = DissolvedMarriage_PartnerLookupFails_returnsWaardeOnbekend/GetPersoonssleutel_out.txt
step6.stub.PostBRPPersonenBevragenDiginetwerkSender.read = DissolvedMarriage_PartnerLookupFails_returnsWaardeOnbekend/PartnerLookup_in.json
step7.stub.PostBRPPersonenBevragenDiginetwerkSender.write = DissolvedMarriage_PartnerLookupFails_returnsWaardeOnbekend/PartnerLookup_out.json
step8.adapter.BrpPersonenQuerySender.read = DissolvedMarriage_PartnerLookupFails_returnsWaardeOnbekend/response.xml
