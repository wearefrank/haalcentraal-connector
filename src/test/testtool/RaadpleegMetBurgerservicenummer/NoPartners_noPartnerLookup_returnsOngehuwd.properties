scenario.description = Given a person without partners, does no partner lookup and returns burgerlijkeStaat 1 (ongehuwd)

include = ../common.properties

removeRegularExpressionKey1.key = (?s)<BG:stuurgegevens[^>]*>.*?</BG:stuurgegevens>
removeRegularExpressionKey2.key = (?s)<BG:parameters[^>]*>.*?</BG:parameters>

adapter.BrpPersonenQuerySender.param1.name = headers
adapter.BrpPersonenQuerySender.param1.value = <headers><header name="SOAPAction">http://www.egem.nl/StUF/sector/bg/0310/npsLv01</header></headers>

step1.adapter.BrpPersonenQuerySender.write = NoPartners_noPartnerLookup_returnsOngehuwd/request.xml
step2.stub.PostBRPPersonenBevragenDiginetwerkSender.read = NoPartners_noPartnerLookup_returnsOngehuwd/BRP_in.json
step3.stub.PostBRPPersonenBevragenDiginetwerkSender.write = NoPartners_noPartnerLookup_returnsOngehuwd/BRP_out.json
step4.stub.GetPersoonssleutel.read = NoPartners_noPartnerLookup_returnsOngehuwd/GetPersoonssleutel_in.txt
step5.stub.GetPersoonssleutel.write = NoPartners_noPartnerLookup_returnsOngehuwd/GetPersoonssleutel_out.txt
step6.adapter.BrpPersonenQuerySender.read = NoPartners_noPartnerLookup_returnsOngehuwd/response.xml
