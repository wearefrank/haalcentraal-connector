scenario.description = Given a dissolved marriage and an application (LBA) that is not authorized for inp.burgerlijkeStaat, does no partner lookup

include = ../common.properties

removeRegularExpressionKey1.key = (?s)<BG:stuurgegevens[^>]*>.*?</BG:stuurgegevens>
removeRegularExpressionKey2.key = (?s)<BG:parameters[^>]*>.*?</BG:parameters>

adapter.BrpPersonenQuerySender.param1.name = headers
adapter.BrpPersonenQuerySender.param1.value = <headers><header name="SOAPAction">http://www.egem.nl/StUF/sector/bg/0310/npsLv01</header></headers>

step1.adapter.BrpPersonenQuerySender.write = DissolvedMarriage_NotAuthorizedForBurgerlijkeStaat_noPartnerLookup/request.xml
step2.stub.PostBRPPersonenBevragenDiginetwerkSender.read = DissolvedMarriage_NotAuthorizedForBurgerlijkeStaat_noPartnerLookup/BRP_in.json
step3.stub.PostBRPPersonenBevragenDiginetwerkSender.write = DissolvedMarriage_NotAuthorizedForBurgerlijkeStaat_noPartnerLookup/BRP_out.json
step4.stub.GetPersoonssleutel.read = DissolvedMarriage_NotAuthorizedForBurgerlijkeStaat_noPartnerLookup/GetPersoonssleutel_in.txt
step5.stub.GetPersoonssleutel.write = DissolvedMarriage_NotAuthorizedForBurgerlijkeStaat_noPartnerLookup/GetPersoonssleutel_out.txt
step6.adapter.BrpPersonenQuerySender.read = DissolvedMarriage_NotAuthorizedForBurgerlijkeStaat_noPartnerLookup/response.xml
