scenario.description = Given geslachtsnaam and voornamen without inp.gemeenteVanInschrijving on the queried person, but with inp.gemeenteVanInschrijving on a related child (inp.heeftAlsKinderen/gerelateerde), sends ZoekMetNaamEnGemeenteVanInschrijving with the gemeente from the gemeenteVanInschrijving property

include = ../common.properties

adapter.BrpPersonenQuerySender.param1.name = headers
adapter.BrpPersonenQuerySender.param1.value = <headers><header name="SOAPAction">http://www.egem.nl/StUF/sector/bg/0310/npsLv01</header></headers>

step1.adapter.BrpPersonenQuerySender.write = GemeenteOnlyInGerelateerde_usesGemeenteFromProperty/request.xml
step2.stub.PostBRPPersonenBevragenDiginetwerkSender.read = GemeenteOnlyInGerelateerde_usesGemeenteFromProperty/BRP_in.json
step3.stub.PostBRPPersonenBevragenDiginetwerkSender.write = GemeenteOnlyInGerelateerde_usesGemeenteFromProperty/BRP_out.json
step4.stub.GetPersoonssleutel.read = GemeenteOnlyInGerelateerde_usesGemeenteFromProperty/GetPersoonssleutel_in.txt
step5.stub.GetPersoonssleutel.write = GemeenteOnlyInGerelateerde_usesGemeenteFromProperty/GetPersoonssleutel_out.txt
step6.adapter.BrpPersonenQuerySender.read = GemeenteOnlyInGerelateerde_usesGemeenteFromProperty/response.xml
