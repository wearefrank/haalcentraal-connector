scenario.description = Given geslachtsnaam, voornamen and inp.gemeenteVanInschrijving (1883) without woonplaatsNaam, sends ZoekMetNaamEnGemeenteVanInschrijving with the gemeente from the message

include = ../common.properties

adapter.BrpPersonenQuerySender.param1.name = headers
adapter.BrpPersonenQuerySender.param1.value = <headers><header name="SOAPAction">http://www.egem.nl/StUF/sector/bg/0310/npsLv01</header></headers>

step1.adapter.BrpPersonenQuerySender.write = GemeenteInMessage_usesGemeenteFromMessage/request.xml
step2.stub.PostBRPPersonenBevragenDiginetwerkSender.read = GemeenteInMessage_usesGemeenteFromMessage/BRP_in.json
step3.stub.PostBRPPersonenBevragenDiginetwerkSender.write = GemeenteInMessage_usesGemeenteFromMessage/BRP_out.json
step4.stub.GetPersoonssleutel.read = GemeenteInMessage_usesGemeenteFromMessage/GetPersoonssleutel_in.txt
step5.stub.GetPersoonssleutel.write = GemeenteInMessage_usesGemeenteFromMessage/GetPersoonssleutel_out.txt
step6.adapter.BrpPersonenQuerySender.read = GemeenteInMessage_usesGemeenteFromMessage/response.xml
