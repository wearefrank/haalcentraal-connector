scenario.description = Given StUF:exact="0" (xs:boolean false) on the geslachtsnaam, sends the geslachtsnaam with wildcard

include = ../common.properties

adapter.BrpPersonenQuerySender.param1.name = headers
adapter.BrpPersonenQuerySender.param1.value = <headers><header name="SOAPAction">http://www.egem.nl/StUF/sector/bg/0310/npsLv01</header></headers>

step1.adapter.BrpPersonenQuerySender.write = GeslachtsnaamExactZero_returnsWildcard/request.xml
step2.stub.PostBRPPersonenBevragenDiginetwerkSender.read = GeslachtsnaamExactZero_returnsWildcard/BRP_in.json
step3.stub.PostBRPPersonenBevragenDiginetwerkSender.write = GeslachtsnaamExactZero_returnsWildcard/BRP_out.json
step4.stub.GetPersoonssleutel.read = GeslachtsnaamExactZero_returnsWildcard/GetPersoonssleutel_in.txt
step5.stub.GetPersoonssleutel.write = GeslachtsnaamExactZero_returnsWildcard/GetPersoonssleutel_out.txt
step6.adapter.BrpPersonenQuerySender.read = GeslachtsnaamExactZero_returnsWildcard/response.xml
