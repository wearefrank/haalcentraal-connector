scenario.description = Given StUF:exact="true" on the geslachtsnaam, sends the geslachtsnaam without wildcard

include = ../common.properties

adapter.BrpPersonenQuerySender.param1.name = headers
adapter.BrpPersonenQuerySender.param1.value = <headers><header name="SOAPAction">http://www.egem.nl/StUF/sector/bg/0310/npsLv01</header></headers>

step1.adapter.BrpPersonenQuerySender.write = GeslachtsnaamExact_returnsWithoutWildcard/request.xml
step2.stub.PostBRPPersonenBevragenDiginetwerkSender.read = GeslachtsnaamExact_returnsWithoutWildcard/BRP_in.json
step3.stub.PostBRPPersonenBevragenDiginetwerkSender.write = GeslachtsnaamExact_returnsWithoutWildcard/BRP_out.json
step4.stub.GetPersoonssleutel.read = GeslachtsnaamExact_returnsWithoutWildcard/GetPersoonssleutel_in.txt
step5.stub.GetPersoonssleutel.write = GeslachtsnaamExact_returnsWithoutWildcard/GetPersoonssleutel_out.txt
step6.adapter.BrpPersonenQuerySender.read = GeslachtsnaamExact_returnsWithoutWildcard/response.xml
