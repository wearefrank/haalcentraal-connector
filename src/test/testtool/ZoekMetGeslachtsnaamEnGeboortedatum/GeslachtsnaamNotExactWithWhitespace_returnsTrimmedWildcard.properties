scenario.description = Given StUF:exact="false" on a geslachtsnaam with surrounding whitespace, sends the trimmed geslachtsnaam with wildcard

include = ../common.properties

adapter.BrpPersonenQuerySender.param1.name = headers
adapter.BrpPersonenQuerySender.param1.value = <headers><header name="SOAPAction">http://www.egem.nl/StUF/sector/bg/0310/npsLv01</header></headers>

step1.adapter.BrpPersonenQuerySender.write = GeslachtsnaamNotExactWithWhitespace_returnsTrimmedWildcard/request.xml
step2.stub.PostBRPPersonenBevragenDiginetwerkSender.read = GeslachtsnaamNotExactWithWhitespace_returnsTrimmedWildcard/BRP_in.json
step3.stub.PostBRPPersonenBevragenDiginetwerkSender.write = GeslachtsnaamNotExactWithWhitespace_returnsTrimmedWildcard/BRP_out.json
step4.stub.GetPersoonssleutel.read = GeslachtsnaamNotExactWithWhitespace_returnsTrimmedWildcard/GetPersoonssleutel_in.txt
step5.stub.GetPersoonssleutel.write = GeslachtsnaamNotExactWithWhitespace_returnsTrimmedWildcard/GetPersoonssleutel_out.txt
step6.adapter.BrpPersonenQuerySender.read = GeslachtsnaamNotExactWithWhitespace_returnsTrimmedWildcard/response.xml
