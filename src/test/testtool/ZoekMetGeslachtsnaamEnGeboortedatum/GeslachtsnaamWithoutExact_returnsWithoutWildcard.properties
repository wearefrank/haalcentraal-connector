scenario.description = Given a geslachtsnaam without StUF:exact attribute (e.g. GWS), sends the geslachtsnaam without wildcard

include = ../common.properties

adapter.BrpPersonenQuerySender.param1.name = headers
adapter.BrpPersonenQuerySender.param1.value = <headers><header name="SOAPAction">http://www.egem.nl/StUF/sector/bg/0310/npsLv01</header></headers>

step1.adapter.BrpPersonenQuerySender.write = GeslachtsnaamWithoutExact_returnsWithoutWildcard/request.xml
step2.stub.PostBRPPersonenBevragenDiginetwerkSender.read = GeslachtsnaamWithoutExact_returnsWithoutWildcard/BRP_in.json
step3.stub.PostBRPPersonenBevragenDiginetwerkSender.write = GeslachtsnaamWithoutExact_returnsWithoutWildcard/BRP_out.json
step4.stub.GetPersoonssleutel.read = GeslachtsnaamWithoutExact_returnsWithoutWildcard/GetPersoonssleutel_in.txt
step5.stub.GetPersoonssleutel.write = GeslachtsnaamWithoutExact_returnsWithoutWildcard/GetPersoonssleutel_out.txt
step6.adapter.BrpPersonenQuerySender.read = GeslachtsnaamWithoutExact_returnsWithoutWildcard/response.xml
