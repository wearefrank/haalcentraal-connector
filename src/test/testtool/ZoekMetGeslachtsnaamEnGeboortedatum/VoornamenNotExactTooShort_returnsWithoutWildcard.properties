scenario.description = Given StUF:exact="false" on voornamen shorter than 3 characters, sends the voornamen without wildcard

include = ../common.properties

adapter.BrpPersonenQuerySender.param1.name = headers
adapter.BrpPersonenQuerySender.param1.value = <headers><header name="SOAPAction">http://www.egem.nl/StUF/sector/bg/0310/npsLv01</header></headers>

step1.adapter.BrpPersonenQuerySender.write = VoornamenNotExactTooShort_returnsWithoutWildcard/request.xml
step2.stub.PostBRPPersonenBevragenDiginetwerkSender.read = VoornamenNotExactTooShort_returnsWithoutWildcard/BRP_in.json
step3.stub.PostBRPPersonenBevragenDiginetwerkSender.write = VoornamenNotExactTooShort_returnsWithoutWildcard/BRP_out.json
step4.stub.GetPersoonssleutel.read = VoornamenNotExactTooShort_returnsWithoutWildcard/GetPersoonssleutel_in.txt
step5.stub.GetPersoonssleutel.write = VoornamenNotExactTooShort_returnsWithoutWildcard/GetPersoonssleutel_out.txt
step6.adapter.BrpPersonenQuerySender.read = VoornamenNotExactTooShort_returnsWithoutWildcard/response.xml
