scenario.description = Given StUF:exact="false" on a geslachtsnaam that already ends with *, sends the geslachtsnaam without an extra wildcard

include = ../common.properties

adapter.BrpPersonenQuerySender.param1.name = headers
adapter.BrpPersonenQuerySender.param1.value = <headers><header name="SOAPAction">http://www.egem.nl/StUF/sector/bg/0310/npsLv01</header></headers>

step1.adapter.BrpPersonenQuerySender.write = GeslachtsnaamNotExactEndingWithWildcard_returnsSingleWildcard/request.xml
step2.stub.PostBRPPersonenBevragenDiginetwerkSender.read = GeslachtsnaamNotExactEndingWithWildcard_returnsSingleWildcard/BRP_in.json
step3.stub.PostBRPPersonenBevragenDiginetwerkSender.write = GeslachtsnaamNotExactEndingWithWildcard_returnsSingleWildcard/BRP_out.json
step4.stub.GetPersoonssleutel.read = GeslachtsnaamNotExactEndingWithWildcard_returnsSingleWildcard/GetPersoonssleutel_in.txt
step5.stub.GetPersoonssleutel.write = GeslachtsnaamNotExactEndingWithWildcard_returnsSingleWildcard/GetPersoonssleutel_out.txt
step6.adapter.BrpPersonenQuerySender.read = GeslachtsnaamNotExactEndingWithWildcard_returnsSingleWildcard/response.xml
