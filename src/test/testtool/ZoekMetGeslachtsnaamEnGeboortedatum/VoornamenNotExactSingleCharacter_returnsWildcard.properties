scenario.description = Given StUF:exact="false" on a single-character voornamen, sends the voornamen with wildcard (VoornamenOptioneelFilter allows a wildcard after 1 character)

include = ../common.properties

adapter.BrpPersonenQuerySender.param1.name = headers
adapter.BrpPersonenQuerySender.param1.value = <headers><header name="SOAPAction">http://www.egem.nl/StUF/sector/bg/0310/npsLv01</header></headers>

step1.adapter.BrpPersonenQuerySender.write = VoornamenNotExactSingleCharacter_returnsWildcard/request.xml
step2.stub.PostBRPPersonenBevragenDiginetwerkSender.read = VoornamenNotExactSingleCharacter_returnsWildcard/BRP_in.json
step3.stub.PostBRPPersonenBevragenDiginetwerkSender.write = VoornamenNotExactSingleCharacter_returnsWildcard/BRP_out.json
step4.stub.GetPersoonssleutel.read = VoornamenNotExactSingleCharacter_returnsWildcard/GetPersoonssleutel_in.txt
step5.stub.GetPersoonssleutel.write = VoornamenNotExactSingleCharacter_returnsWildcard/GetPersoonssleutel_out.txt
step6.adapter.BrpPersonenQuerySender.read = VoornamenNotExactSingleCharacter_returnsWildcard/response.xml
