scenario.description = Given StUF:exact="false" on a straatnaam of at least 7 characters, sends the straat with wildcard

include = ../common.properties

adapter.BrpPersonenQuerySender.param1.name = headers
adapter.BrpPersonenQuerySender.param1.value = <headers><header name="SOAPAction">http://www.egem.nl/StUF/sector/bg/0310/npsLv01</header></headers>

step1.adapter.BrpPersonenQuerySender.write = StraatNotExact_returnsWildcard/request.xml
step2.stub.PostBRPPersonenBevragenDiginetwerkSender.read = StraatNotExact_returnsWildcard/BRP_in.json
step3.stub.PostBRPPersonenBevragenDiginetwerkSender.write = StraatNotExact_returnsWildcard/BRP_out.json
step4.stub.GetPersoonssleutel.read = StraatNotExact_returnsWildcard/GetPersoonssleutel_in.txt
step5.stub.GetPersoonssleutel.write = StraatNotExact_returnsWildcard/GetPersoonssleutel_out.txt
step6.adapter.BrpPersonenQuerySender.read = StraatNotExact_returnsWildcard/response.xml
