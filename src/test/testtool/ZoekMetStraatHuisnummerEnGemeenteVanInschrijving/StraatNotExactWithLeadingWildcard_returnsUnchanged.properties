scenario.description = Given StUF:exact="false" on a straatnaam that starts with *, sends the straat without an extra trailing wildcard

include = ../common.properties

adapter.BrpPersonenQuerySender.param1.name = headers
adapter.BrpPersonenQuerySender.param1.value = <headers><header name="SOAPAction">http://www.egem.nl/StUF/sector/bg/0310/npsLv01</header></headers>

step1.adapter.BrpPersonenQuerySender.write = StraatNotExactWithLeadingWildcard_returnsUnchanged/request.xml
step2.stub.PostBRPPersonenBevragenDiginetwerkSender.read = StraatNotExactWithLeadingWildcard_returnsUnchanged/BRP_in.json
step3.stub.PostBRPPersonenBevragenDiginetwerkSender.write = StraatNotExactWithLeadingWildcard_returnsUnchanged/BRP_out.json
step4.stub.GetPersoonssleutel.read = StraatNotExactWithLeadingWildcard_returnsUnchanged/GetPersoonssleutel_in.txt
step5.stub.GetPersoonssleutel.write = StraatNotExactWithLeadingWildcard_returnsUnchanged/GetPersoonssleutel_out.txt
step6.adapter.BrpPersonenQuerySender.read = StraatNotExactWithLeadingWildcard_returnsUnchanged/response.xml
