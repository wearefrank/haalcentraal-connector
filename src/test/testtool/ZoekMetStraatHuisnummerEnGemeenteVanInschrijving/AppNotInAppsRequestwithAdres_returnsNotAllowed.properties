scenario.description = Given a straat + huisnummer + gemeente search from an application that is not in apps_requestwithAdres, returns the not allowed error

include = ../common.properties

adapter.BrpPersonenQuerySender.param1.name = headers
adapter.BrpPersonenQuerySender.param1.value = <headers><header name="SOAPAction">http://www.egem.nl/StUF/sector/bg/0310/npsLv01</header></headers>

step1.adapter.BrpPersonenQuerySender.write = AppNotInAppsRequestwithAdres_returnsNotAllowed/request.xml
step2.adapter.BrpPersonenQuerySender.read = AppNotInAppsRequestwithAdres_returnsNotAllowed/response.xml
