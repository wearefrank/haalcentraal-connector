scenario.description = Given a dissolved marriage followed by an active registered partnership, sends burgerlijkeStaat 5 (geregistreerd partner) in the callback
scenario.active=true

include = ../../common.properties

removeRegularExpressionKey1.key = (?s)<BG:stuurgegevens[^>]*>.*?</BG:stuurgegevens>
removeRegularExpressionKey2.key = (?s)<BG:parameters[^>]*>.*?</BG:parameters>

adapter.BrpPersonenCallbackSender.param1.name = applicationConfig
adapter.BrpPersonenCallbackSender.param1.valuefile = ActivePartnershipAndDissolvedMarriage_sendsGeregistreerdPartner/ApplicationConfig.json

adapter.BrpPersonenCallbackSender.param2.name = enableCallback
adapter.BrpPersonenCallbackSender.param2.value = true

step1.adapter.BrpPersonenCallbackSender.write = ActivePartnershipAndDissolvedMarriage_sendsGeregistreerdPartner/in.json
step2.stub.mapBagIdentifiersToKeys.read = ActivePartnershipAndDissolvedMarriage_sendsGeregistreerdPartner/mapBagIdentifiersToKeysInput.xml
step3.stub.mapBagIdentifiersToKeys.write = ActivePartnershipAndDissolvedMarriage_sendsGeregistreerdPartner/mapBagIdentifiersToKeysOutput.xml
step4.stub.GetPersoonssleutel.read = ActivePartnershipAndDissolvedMarriage_sendsGeregistreerdPartner/bsn.txt
step5.stub.GetPersoonssleutel.write = ActivePartnershipAndDissolvedMarriage_sendsGeregistreerdPartner/sleutel.txt
step6.stub.callback.read = ActivePartnershipAndDissolvedMarriage_sendsGeregistreerdPartner/callbackInput.xml
step7.stub.callback.write = ActivePartnershipAndDissolvedMarriage_sendsGeregistreerdPartner/output.txt
step8.adapter.BrpPersonenCallbackSender.read = ActivePartnershipAndDissolvedMarriage_sendsGeregistreerdPartner/output.txt
