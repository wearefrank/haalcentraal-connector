scenario.description = Given a marriage dissolved on an incomplete date (JaarMaandDatum), sends burgerlijkeStaat 3 (gescheiden) in the callback
scenario.active=true

include = ../../common.properties

removeRegularExpressionKey1.key = (?s)<BG:stuurgegevens[^>]*>.*?</BG:stuurgegevens>
removeRegularExpressionKey2.key = (?s)<BG:parameters[^>]*>.*?</BG:parameters>

adapter.BrpPersonenCallbackSender.param1.name = applicationConfig
adapter.BrpPersonenCallbackSender.param1.valuefile = DissolvedMarriageWithPartialDate_sendsGescheiden/ApplicationConfig.json

adapter.BrpPersonenCallbackSender.param2.name = enableCallback
adapter.BrpPersonenCallbackSender.param2.value = true

step1.adapter.BrpPersonenCallbackSender.write = DissolvedMarriageWithPartialDate_sendsGescheiden/in.json
step2.stub.mapBagIdentifiersToKeys.read = DissolvedMarriageWithPartialDate_sendsGescheiden/mapBagIdentifiersToKeysInput.xml
step3.stub.mapBagIdentifiersToKeys.write = DissolvedMarriageWithPartialDate_sendsGescheiden/mapBagIdentifiersToKeysOutput.xml
step4.stub.GetPersoonssleutel.read = DissolvedMarriageWithPartialDate_sendsGescheiden/bsn.txt
step5.stub.GetPersoonssleutel.write = DissolvedMarriageWithPartialDate_sendsGescheiden/sleutel.txt
step6.stub.callback.read = DissolvedMarriageWithPartialDate_sendsGescheiden/callbackInput.xml
step7.stub.callback.write = DissolvedMarriageWithPartialDate_sendsGescheiden/output.txt
step8.adapter.BrpPersonenCallbackSender.read = DissolvedMarriageWithPartialDate_sendsGescheiden/output.txt
