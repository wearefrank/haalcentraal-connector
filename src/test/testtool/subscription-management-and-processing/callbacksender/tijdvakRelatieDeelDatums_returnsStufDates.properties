scenario.description = Given partial relation dates, sends formatted StUF dates in the callback
scenario.active=${enableCallback}

include = ../../common.properties

adapter.BrpPersonenCallbackSender.param1.name = applicationConfig
adapter.BrpPersonenCallbackSender.param1.valuefile = tijdvakRelatieDeelDatums_returnsStufDates/ApplicationConfig.json

step1.adapter.BrpPersonenCallbackSender.write = tijdvakRelatieDeelDatums_returnsStufDates/in.json
step2.stub.GetBsnByPersoonsSleutel.read = tijdvakRelatieDeelDatums_returnsStufDates/GetBsnBySleutelInput.xml
step3.stub.GetBsnByPersoonsSleutel.write = tijdvakRelatieDeelDatums_returnsStufDates/GetBsnBySleutelOutput.xml
step4.stub.mapBagIdentifiersToKeys.read = tijdvakRelatieDeelDatums_returnsStufDates/mapBagIdentifiersToKeysInput.xml
step5.stub.mapBagIdentifiersToKeys.write = tijdvakRelatieDeelDatums_returnsStufDates/mapBagIdentifiersToKeysOutput.xml
step6.stub.GetPersoonssleutel.read = tijdvakRelatieDeelDatums_returnsStufDates/bsn.txt
step7.stub.GetPersoonssleutel.write = tijdvakRelatieDeelDatums_returnsStufDates/sleutel.txt
step8.stub.callback.read = tijdvakRelatieDeelDatums_returnsStufDates/callbackInput.xml
step9.stub.callback.write = tijdvakRelatieDeelDatums_returnsStufDates/output.txt
step10.adapter.BrpPersonenCallbackSender.read = tijdvakRelatieDeelDatums_returnsStufDates/output.txt