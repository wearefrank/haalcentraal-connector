scenario.description = Given a dissolved partner with an unknown soortVerbintenis, sends StUF:noValue waardeOnbekend for burgerlijkeStaat in the callback
scenario.active=true

include = ../../common.properties

removeRegularExpressionKey1.key = (?s)<BG:stuurgegevens[^>]*>.*?</BG:stuurgegevens>
removeRegularExpressionKey2.key = (?s)<BG:parameters[^>]*>.*?</BG:parameters>

adapter.BrpPersonenCallbackSender.param1.name = applicationConfig
adapter.BrpPersonenCallbackSender.param1.valuefile = DissolvedPartnerWithUnknownSoortVerbintenis_sendsNoValueWaardeOnbekend/ApplicationConfig.json

adapter.BrpPersonenCallbackSender.param2.name = enableCallback
adapter.BrpPersonenCallbackSender.param2.value = true

step1.adapter.BrpPersonenCallbackSender.write = DissolvedPartnerWithUnknownSoortVerbintenis_sendsNoValueWaardeOnbekend/in.json
step2.stub.mapBagIdentifiersToKeys.read = DissolvedPartnerWithUnknownSoortVerbintenis_sendsNoValueWaardeOnbekend/mapBagIdentifiersToKeysInput.xml
step3.stub.mapBagIdentifiersToKeys.write = DissolvedPartnerWithUnknownSoortVerbintenis_sendsNoValueWaardeOnbekend/mapBagIdentifiersToKeysOutput.xml
step4.stub.GetPersoonssleutel.read = DissolvedPartnerWithUnknownSoortVerbintenis_sendsNoValueWaardeOnbekend/bsn.txt
step5.stub.GetPersoonssleutel.write = DissolvedPartnerWithUnknownSoortVerbintenis_sendsNoValueWaardeOnbekend/sleutel.txt
step6.stub.callback.read = DissolvedPartnerWithUnknownSoortVerbintenis_sendsNoValueWaardeOnbekend/callbackInput.xml
step7.stub.callback.write = DissolvedPartnerWithUnknownSoortVerbintenis_sendsNoValueWaardeOnbekend/output.txt
step8.adapter.BrpPersonenCallbackSender.read = DissolvedPartnerWithUnknownSoortVerbintenis_sendsNoValueWaardeOnbekend/output.txt
