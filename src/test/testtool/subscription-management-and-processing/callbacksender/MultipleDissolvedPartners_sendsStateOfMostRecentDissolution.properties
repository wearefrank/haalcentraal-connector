scenario.description = Given three dissolved relations of which the most recent has an incomplete date, sends burgerlijkeStaat 6 for the most recently dissolved partnership in the callback
scenario.active=true

include = ../../common.properties

removeRegularExpressionKey1.key = (?s)<BG:stuurgegevens[^>]*>.*?</BG:stuurgegevens>
removeRegularExpressionKey2.key = (?s)<BG:parameters[^>]*>.*?</BG:parameters>

adapter.BrpPersonenCallbackSender.param1.name = applicationConfig
adapter.BrpPersonenCallbackSender.param1.valuefile = MultipleDissolvedPartners_sendsStateOfMostRecentDissolution/ApplicationConfig.json

adapter.BrpPersonenCallbackSender.param2.name = enableCallback
adapter.BrpPersonenCallbackSender.param2.value = true

step1.adapter.BrpPersonenCallbackSender.write = MultipleDissolvedPartners_sendsStateOfMostRecentDissolution/in.json
step2.stub.mapBagIdentifiersToKeys.read = MultipleDissolvedPartners_sendsStateOfMostRecentDissolution/mapBagIdentifiersToKeysInput.xml
step3.stub.mapBagIdentifiersToKeys.write = MultipleDissolvedPartners_sendsStateOfMostRecentDissolution/mapBagIdentifiersToKeysOutput.xml
step4.stub.GetPersoonssleutel.read = MultipleDissolvedPartners_sendsStateOfMostRecentDissolution/bsn.txt
step5.stub.GetPersoonssleutel.write = MultipleDissolvedPartners_sendsStateOfMostRecentDissolution/sleutel.txt
step6.stub.callback.read = MultipleDissolvedPartners_sendsStateOfMostRecentDissolution/callbackInput.xml
step7.stub.callback.write = MultipleDissolvedPartners_sendsStateOfMostRecentDissolution/output.txt
step8.adapter.BrpPersonenCallbackSender.read = MultipleDissolvedPartners_sendsStateOfMostRecentDissolution/output.txt
