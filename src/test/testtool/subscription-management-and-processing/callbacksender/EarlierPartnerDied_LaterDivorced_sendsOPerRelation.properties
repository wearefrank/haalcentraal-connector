scenario.description = Given an earlier marriage ended by the death of the partner and a later marriage ended by divorce, sends burgerlijkeStaat 3 and redenOntbinding O for the earlier and S for the later relation
scenario.active=true

include = ../../common.properties

removeRegularExpressionKey1.key = (?s)<BG:stuurgegevens[^>]*>.*?</BG:stuurgegevens>
removeRegularExpressionKey2.key = (?s)<BG:parameters[^>]*>.*?</BG:parameters>
removeRegularExpressionKey3.key = (?s)(?<=<BG:object[^>]{0,300}>).*?(?=<BG:inp\.burgerlijkeStaat)
removeRegularExpressionKey4.key = (?s)<BG:inp\.gemeenteVanInschrijving.*?(?=<BG:inp\.heeftAlsEchtgenootPartner)
removeRegularExpressionKey5.key = (?s)<BG:gerelateerde.*?(?=<BG:datumOntbinding)
removeRegularExpressionKey6.key = (?s)<BG:inp\.heeftAlsOuders.*?(?=</BG:object>)

adapter.BrpPersonenCallbackSender.param1.name = applicationConfig
adapter.BrpPersonenCallbackSender.param1.valuefile = 01/ApplicationConfig.json

adapter.BrpPersonenCallbackSender.param2.name = enableCallback
adapter.BrpPersonenCallbackSender.param2.value = true

step1.adapter.BrpPersonenCallbackSender.write = EarlierPartnerDied_LaterDivorced_sendsOPerRelation/in.json
step2.stub.mapBagIdentifiersToKeys.read = 01/mapBagIdentifiersToKeysInput.xml
step3.stub.mapBagIdentifiersToKeys.write = 01/mapBagIdentifiersToKeysOutput.xml
step4.stub.GetPersoonssleutel.read = 01/bsn.txt
step5.stub.GetPersoonssleutel.write = 01/sleutel.txt
step6.stub.PostBRPPersonenBevragenDiginetwerkSender.read = EarlierPartnerDied_LaterDivorced_sendsOPerRelation/BRP_partner_in.json
step7.stub.PostBRPPersonenBevragenDiginetwerkSender.write = EarlierPartnerDied_LaterDivorced_sendsOPerRelation/BRP_partner_out.json
step8.stub.callback.read = EarlierPartnerDied_LaterDivorced_sendsOPerRelation/callbackInput.xml
step9.stub.callback.write = 01/output.txt
step10.adapter.BrpPersonenCallbackSender.read = 01/output.txt
