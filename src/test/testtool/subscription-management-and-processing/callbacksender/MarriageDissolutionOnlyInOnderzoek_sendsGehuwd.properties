scenario.description = Given a marriage whose dissolution only has inOnderzoek and no date, sends burgerlijkeStaat 2 (gehuwd) in the callback
scenario.active=true

include = ../../common.properties

removeRegularExpressionKey1.key = (?s)<BG:stuurgegevens[^>]*>.*?</BG:stuurgegevens>
removeRegularExpressionKey2.key = (?s)<BG:parameters[^>]*>.*?</BG:parameters>

adapter.BrpPersonenCallbackSender.param1.name = applicationConfig
adapter.BrpPersonenCallbackSender.param1.valuefile = MarriageDissolutionOnlyInOnderzoek_sendsGehuwd/ApplicationConfig.json

adapter.BrpPersonenCallbackSender.param2.name = enableCallback
adapter.BrpPersonenCallbackSender.param2.value = true

step1.adapter.BrpPersonenCallbackSender.write = MarriageDissolutionOnlyInOnderzoek_sendsGehuwd/in.json
step2.stub.mapBagIdentifiersToKeys.read = MarriageDissolutionOnlyInOnderzoek_sendsGehuwd/mapBagIdentifiersToKeysInput.xml
step3.stub.mapBagIdentifiersToKeys.write = MarriageDissolutionOnlyInOnderzoek_sendsGehuwd/mapBagIdentifiersToKeysOutput.xml
step4.stub.GetPersoonssleutel.read = MarriageDissolutionOnlyInOnderzoek_sendsGehuwd/bsn.txt
step5.stub.GetPersoonssleutel.write = MarriageDissolutionOnlyInOnderzoek_sendsGehuwd/sleutel.txt
step6.stub.callback.read = MarriageDissolutionOnlyInOnderzoek_sendsGehuwd/callbackInput.xml
step7.stub.callback.write = MarriageDissolutionOnlyInOnderzoek_sendsGehuwd/output.txt
step8.adapter.BrpPersonenCallbackSender.read = MarriageDissolutionOnlyInOnderzoek_sendsGehuwd/output.txt
