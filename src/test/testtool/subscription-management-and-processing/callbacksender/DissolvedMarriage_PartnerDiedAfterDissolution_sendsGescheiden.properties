adapter.BrpPersonenCallbackSender.param1.valuefile = DissolvedMarriage_PartnerDiedAfterDissolution_sendsGescheiden/ApplicationConfig.json

adapter.BrpPersonenCallbackSender.param2.name = enableCallback
